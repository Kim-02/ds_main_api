<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>센서 실시간 보기</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #dbe3ef;
      --text: #152033;
      --muted: #66758f;
      --hot: #c2410c;
      --cool: #0f766e;
      --heart: #be123c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .status { color: var(--muted); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    h2 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .count { color: var(--muted); font-size: 13px; }
    .list { display: grid; }
    .row {
      display: grid;
      grid-template-columns: minmax(120px, 1.4fr) repeat(2, minmax(92px, .8fr)) minmax(120px, 1fr);
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid #edf1f7;
      min-height: 68px;
    }
    .row:last-child { border-bottom: 0; }
    .watch-row {
      grid-template-columns: minmax(120px, 1.4fr) minmax(92px, .8fr) minmax(120px, 1fr);
    }
    .sensor-id { font-weight: 700; overflow-wrap: anywhere; }
    .label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .value { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .temp .value { color: var(--hot); }
    .humid .value { color: var(--cool); }
    .hr .value { color: var(--heart); }
    .time { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .empty { padding: 28px 18px; color: var(--muted); }
    .flash { animation: flash 900ms ease-out; }
    @keyframes flash {
      0% { background: #fff7ed; }
      100% { background: #ffffff; }
    }
    @media (max-width: 820px) {
      main { width: min(100% - 20px, 1180px); padding-top: 18px; }
      header { display: block; }
      .status { margin-top: 8px; }
      .grid { grid-template-columns: 1fr; }
      .row, .watch-row { grid-template-columns: 1fr 1fr; }
      .sensor-id, .time { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>센서 실시간 보기</h1>
      <div id="status" class="status">연결 준비 중</div>
    </header>
    <div class="grid">
      <section>
        <div class="section-head">
          <h2>온습도</h2>
          <span id="th-count" class="count">0개</span>
        </div>
        <div id="th-list" class="list"><div class="empty">온습도 값이 아직 없습니다.</div></div>
      </section>
      <section>
        <div class="section-head">
          <h2>워치</h2>
          <span id="watch-count" class="count">0개</span>
        </div>
        <div id="watch-list" class="list"><div class="empty">심박 값이 아직 없습니다.</div></div>
      </section>
    </div>
  </main>
  <script>
    const thMap = new Map();
    const watchMap = new Map();
    const statusEl = document.getElementById("status");
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
    const fmt = (value, suffix = "") => {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      return Number.isFinite(n) ? `${Math.round(n * 10) / 10}${suffix}` : `${esc(value)}${suffix}`;
    };
    const fmtTime = (value) => {
      if (!value) return "수신 대기";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return esc(value);
      return d.toLocaleString("ko-KR", { hour12: false });
    };
    function upsert(map, item) {
      if (!item || !item.sensor_id) return;
      const key = String(item.sensor_id);
      map.set(key, { ...map.get(key), ...item });
    }
    function renderTh() {
      const list = document.getElementById("th-list");
      const rows = [...thMap.values()].sort((a, b) => String(a.sensor_id).localeCompare(String(b.sensor_id)));
      document.getElementById("th-count").textContent = `${rows.length}개`;
      if (!rows.length) {
        list.innerHTML = '<div class="empty">온습도 값이 아직 없습니다.</div>';
        return;
      }
      list.innerHTML = rows.map((r) => `
        <div class="row" data-id="${esc(r.sensor_id)}">
          <div class="sensor-id">${esc(r.sensor_id)}</div>
          <div class="temp"><span class="label">temp</span><span class="value">${fmt(r.temp, "°C")}</span></div>
          <div class="humid"><span class="label">humid</span><span class="value">${fmt(r.humid, "%")}</span></div>
          <div class="time">${fmtTime(r.time)}</div>
        </div>
      `).join("");
    }
    function renderWatch() {
      const list = document.getElementById("watch-list");
      const rows = [...watchMap.values()].sort((a, b) => String(a.sensor_id).localeCompare(String(b.sensor_id)));
      document.getElementById("watch-count").textContent = `${rows.length}개`;
      if (!rows.length) {
        list.innerHTML = '<div class="empty">심박 값이 아직 없습니다.</div>';
        return;
      }
      list.innerHTML = rows.map((r) => `
        <div class="row watch-row" data-id="${esc(r.sensor_id)}">
          <div class="sensor-id">${esc(r.sensor_id)}</div>
          <div class="hr"><span class="label">hr</span><span class="value">${fmt(r.hr, " bpm")}</span></div>
          <div class="time">${fmtTime(r.time)}</div>
        </div>
      `).join("");
    }
    function flash(listId, sensorId) {
      const el = document.querySelector(`#${listId} [data-id="${CSS.escape(String(sensorId))}"]`);
      if (!el) return;
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }
    async function loadInitial() {
      const res = await fetch("/live/api/latest");
      const data = await res.json();
      (data.th || []).forEach((item) => upsert(thMap, item));
      (data.watch || []).forEach((item) => upsert(watchMap, item));
      renderTh();
      renderWatch();
    }
    function connect(path, onMessage) {
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${scheme}://${location.host}${path}`);
      ws.onopen = () => { statusEl.textContent = "실시간 연결됨"; };
      ws.onmessage = (event) => onMessage(JSON.parse(event.data));
      ws.onclose = () => {
        statusEl.textContent = "연결 끊김, 재연결 중";
        setTimeout(() => connect(path, onMessage), 1500);
      };
      ws.onerror = () => ws.close();
    }
    loadInitial().catch(() => { statusEl.textContent = "초기 데이터 조회 실패"; });
    connect("/ws/th", (item) => {
      upsert(thMap, item);
      renderTh();
      flash("th-list", item.sensor_id);
    });
    connect("/ws/vital", (item) => {
      upsert(watchMap, item);
      renderWatch();
      flash("watch-list", item.sensor_id);
    });
  </script>
</body>
</html>
